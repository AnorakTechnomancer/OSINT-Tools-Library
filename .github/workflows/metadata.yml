name: Metadata and category tables
on:
  push:
    paths: ['osint-tools/**', 'tool-categories/**', 'scripts/**', 'requirements.txt', '.github/workflows/metadata.yml']
  pull_request:
    paths: ['osint-tools/**', 'tool-categories/**', 'scripts/**', 'requirements.txt', '.github/workflows/metadata.yml']
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python scripts/validate_tool_metadata.py
      - run: python -m unittest discover -s scripts -p 'test_*.py'
      - run: python scripts/generate_category_tables.py --check
